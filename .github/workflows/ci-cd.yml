name: DTST Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "update*", "dtst_V2.1", "master" ]
  pull_request:
    branches: [ "main", "update*", "dtst_V2.1", "master" ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Verification, Typecheck & Tests
  # ----------------------------------------------------------------------------
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Typecheck Server & Client (TypeScript)
        run: npm run typecheck

      - name: Run Client Unit Tests
        run: npm run test -w client

      - name: Build Server & Client Production Bundles
        run: npm run build

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Python Trip Planner V9 Engine
        run: |
          python -X utf8 -m py_compile documents/trip_planner_17_v9/web_api.py documents/trip_planner_17_v9/trip_service.py documents/trip_planner_17_v9/progress.py documents/trip_planner_17_v9/assemble.py
          python -X utf8 -m unittest discover -s documents/trip_planner_17_v9 -p "test_*.py"

  # ----------------------------------------------------------------------------
  # Job 2: Enterprise Container Build Check
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Images Build Validation
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Server API Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: dtst-server-api:test

      - name: Build Client Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: dtst-client-web:test

      - name: Build Trip Planner V9 Image
        uses: docker/build-push-action@v5
        with:
          context: ./documents/trip_planner_17_v9
          file: ./documents/trip_planner_17_v9/Dockerfile
          push: false
          tags: dtst-planner-v9:test
